{% extends 'store/base.html' %}

{% block title %}Transactions - MamaStockin{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">Transactions</h2>
        <a href="{% url 'store_home' %}" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg font-medium transition">Back to Home</a>
    </div>

    <!-- Transaction Form Placeholder -->
    <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-3">
        <h3 class="text-sm font-semibold text-gray-700">Record Transaction (Frontend Only)</h3>
        <select class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white text-gray-500">
            <option>Select Product</option>
        </select>
        <input type="number" placeholder="Quantity sold" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
        <button class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">Record Sale</button>
    </div>

    <!-- Transaction History -->
    <div class="space-y-2">
        <div class="bg-white border border-gray-200 p-3 rounded-lg flex justify-between items-center shadow-sm">
            <div>
                <h4 class="font-semibold text-gray-800 text-sm">Pulsa Telemor 10k</h4>
                <p class="text-xs text-gray-500">Qty: 3 | Date: Today</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-bold text-amber-600">$3.00</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
