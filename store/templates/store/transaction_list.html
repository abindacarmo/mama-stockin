{% extends 'store/base.html' %}

{% block title %}Transactions - MamaStockin{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">Transactions</h2>
        <a href="{% url 'store_home' %}" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg font-medium transition">Back to Home</a>
    </div>

    <!-- Transaction Form -->
    <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-3 shadow-sm">
        <h3 class="text-sm font-semibold text-gray-700">Record Sale</h3>
        <form method="POST" class="space-y-3">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Select Product</label>
                <select name="product_id" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white text-gray-700">
                    <option value="">-- Choose Product --</option>
                    {% for product in products %}
                        <option value="{{ product.id }}">{{ product.name }} (Stock: {{ product.stock }}) - ${{ product.selling_price }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-600 mb-1">Quantity</label>
                <input type="number" name="quantity" min="1" value="1" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
            </div>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">Record Sale</button>
        </form>
    </div>

    <!-- Transaction History -->
    <div class="space-y-2">
        <h3 class="text-sm font-semibold text-gray-700">Recent Sales</h3>
        <div class="text-gray-500 text-center py-6 bg-gray-50 rounded-lg border border-dashed border-gray-300 text-sm">
            No transactions recorded yet.
        </div>
    </div>
</div>
{% endblock %}
