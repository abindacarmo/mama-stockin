<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MamaStockin{% endblock %}</title>
    <!-- Tailwind CSS CDN for simple styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 font-sans">
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-lg flex flex-col">
        <!-- Header -->
        <header class="bg-pink-600 text-white p-4 shadow">
            <h1 class="text-xl font-bold text-center">MamaStockin</h1>
            <p class="text-xs text-pink-200 text-center">Store Management</p>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-4">
            {% block content %}
            {% endblock %}
        </main>

        <!-- Footer -->
        <footer class="bg-gray-50 text-center py-3 text-xs text-gray-500 border-t">
            &copy; 2026 MamaStockin
        </footer>
    </div>
</body>
</html>
