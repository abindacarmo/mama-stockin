{% extends 'store/base.html' %}

{% block title %}Expenses - MamaStockin{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">Expenses</h2>
        <a href="{% url 'store_home' %}" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg font-medium transition">Back to Home</a>
    </div>

    <!-- Expense Form Placeholder -->
    <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-3">
        <h3 class="text-sm font-semibold text-gray-700">Add Expense (Frontend Only)</h3>
        <input type="text" placeholder="Description (e.g. Transport)" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
        <input type="number" placeholder="Amount" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
        <button class="w-full bg-rose-600 hover:bg-rose-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">Save Expense</button>
    </div>

    <!-- Expense List -->
    <div class="space-y-2">
        <div class="bg-white border border-gray-200 p-3 rounded-lg flex justify-between items-center shadow-sm">
            <div>
                <h4 class="font-semibold text-gray-800 text-sm">Transport to shop</h4>
                <p class="text-xs text-gray-500">Date: Today</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-bold text-rose-600">$5.00</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
