{% extends 'store/base.html' %}

{% block title %}Products - MamaStockin{% endblock %}

{% block content %}
<div class="space-y-4">
    <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">Products</h2>
        <a href="{% url 'store_home' %}" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-1.5 rounded-lg font-medium transition">Back to Home</a>
    </div>

    <!-- Product Form / Input Placeholder -->
    <div class="bg-gray-50 border border-gray-200 p-4 rounded-xl space-y-3">
        <h3 class="text-sm font-semibold text-gray-700">Add New Product (Frontend Only)</h3>
        <input type="text" placeholder="Product name/type (e.g. Pulsa Telemor)" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
        <select class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white text-gray-500">
            <option>Select Category</option>
        </select>
        <div class="grid grid-cols-2 gap-2">
            <input type="number" placeholder="Purchase Price" class="text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
            <input type="number" placeholder="Selling Price" class="text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
        </div>
        <input type="number" placeholder="Initial Stock" class="w-full text-sm border border-gray-300 rounded-lg p-2.5 bg-white">
        <button class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg text-sm transition">Save Product</button>
    </div>

    <!-- Product List -->
    <div class="space-y-2">
        <div class="bg-white border border-gray-200 p-3 rounded-lg flex justify-between items-center shadow-sm">
            <div>
                <h4 class="font-semibold text-gray-800 text-sm">Pulsa Telemor 10k</h4>
                <p class="text-xs text-gray-500">Category: Pulsa | Stock: 45</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-bold text-emerald-600">$10.00</span>
            </div>
        </div>
        <div class="bg-white border border-gray-200 p-3 rounded-lg flex justify-between items-center shadow-sm">
            <div>
                <h4 class="font-semibold text-gray-800 text-sm">Teri Plastik 250g</h4>
                <p class="text-xs text-gray-500">Category: Teri | Stock: 12</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-bold text-emerald-600">$5.00</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
